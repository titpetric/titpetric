StylesPath = .vale/styles
MinAlertLevel = suggestion

# One style, vendored under .vale/styles, so the lint needs no network and
# reports the same findings on every machine. Five of its thirty-nine rules
# come from write-good and each one says so in its own header, with the
# upstream it was taken from and the licence it carries.
#
# One section for the markdown and the code together, because the two are held
# to the same rules. A doc comment is prose, and so is the comment above a
# function, a CSS block or a migration. Documentation is written in markdown
# and also generated from the source, so a rule that only reads docs/ reaches
# the generated page and never the comment it was generated from.
#
# vale parses each of these for its comments and its strings; the extensions
# are the ones these repositories are written in. YAML and JSON stay out: the
# comments in them are configuration notes, and the generated schema dumps
# would report under every rule.
[*.{md,go,php,js,jsx,ts,tsx,css,scss,html,py,sh,sql}]
BasedOnStyles = llm-slop

# Trees nobody here writes. An agent worktree is a checkout of these same
# files, so counting one multiplies every finding by the number of worktrees.
# composer and npm write the next two at any depth, and third-party prose is
# not ours to rewrite. Fixtures are inputs to a test, held to no prose rule.
[.claude/**]
BasedOnStyles =

[**/vendor/**]
BasedOnStyles =

[**/node_modules/**]
BasedOnStyles =

[**/testdata/**]
BasedOnStyles =

# Generated output. The prose in it belongs to the generator, so a finding
# here is a finding against a template that does not live in this tree:
# templ for the views, mig for the models and the schema pages, protoc for
# the wire types.
[**/*_templ.go]
BasedOnStyles =

[**/*.mig.go]
BasedOnStyles =

[**/*.pb.go]
BasedOnStyles =

[schema/docs/**]
BasedOnStyles =

# The template's checklist is written in the first person because a human
# author ticks it. AgentNarration is for prose that reports the work instead
# of the change.
[.github/PULL_REQUEST_TEMPLATE.md]
llm-slop.AgentNarration = NO
