name: Create a GitHub release
help: >-
  Cuts a GitHub release for the newest git tag: builds and tests the docker
  image, creates the release, and uploads the binaries from bin/.

when:
  files:
    - .github/
    - docker/Dockerfile

vars:
  name: $(basename $(realpath -s .))
  semver: $(git tag --sort=version:refname | tail -n 1)
  image: titpetric/${{name}}
  build:
    goos: [linux]
    goarch: [amd64]

tasks:
  default:
    desc: "Print the newest tag, then build and test the assets"
    cmds:
      - cmd: echo "Latest git tag ${{semver}}"
      - task: build
      - task: test

  build:
    desc: "Build the docker image for the release"
    cmds:
      - task: docker:build

  test:
    desc: "Run the docker image test for the release"
    cmds:
      - task: docker:test

  publish:
    desc: "Create the GitHub release and push the docker image"
    aliases: [publish]
    cmds:
      - if: semver != ""
        task: publish:github
      - task: docker:push

  publish:github:
    desc: "Create the release and upload the binaries from bin/"
    cmds:
      - cmd: echo "Last release [${{semver}}]"
      - gh release create ${{ semver }} --title ${{semver}} --notes "Release ${{semver}}" || true
      - for:
          - goos in ${{build.goos}}
          - goarch in ${{build.goarch}}
        cmd: gh release upload --clobber ${{ semver }} ./bin/${{name}}-${{goos}}-${{goarch}}
