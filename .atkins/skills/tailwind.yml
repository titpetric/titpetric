name: Tailwind CSS generation
help: >-
  Generates view/assets/css/tailwind.css from view/assets/css/input.css. Reads
  tailwind.config.js; tailwind:watch keeps regenerating on change.

when:
  files:
    - tailwind.config.js

vars:
  input: view/assets/css/input.css
  output: view/assets/css/tailwind.css

tasks:
  setup:
    desc: "Install Tailwind 3, postcss and autoprefixer"
    cmds:
      - npm install -D tailwindcss@3 postcss autoprefixer

  generate:
    desc: "Generate tailwind.css from input.css"
    cmds:
      - cmd: tailwindcss -i ${{input}} -o ${{output}}

  watch:
    desc: "Regenerate tailwind.css on every change to the input"
    cmds:
      - cmd: tailwindcss -i ${{input}} -o ${{output}} --watch
