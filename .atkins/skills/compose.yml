name: Docker compose lifecycle
help: >-
  Drives docker compose from the folder holding compose.yml: up, down, build,
  pull, ps and logs. Reads compose.yml or docker-compose.yml and writes nothing
  of its own.

when:
  files:
    - compose.yml
    - docker-compose.yml

tasks:
  up:
    desc: "Start the services and wait for them to be healthy"
    cmds:
      - docker compose up -d --remove-orphans --wait

  down:
    desc: "Stop the services and remove their containers"
    cmds:
      - docker compose down --remove-orphans

  build:
    desc: "Build the services that declare a build context"
    cmds:
      - docker compose build

  pull:
    desc: "Pull the service images"
    cmds:
      - docker compose pull

  ps:
    desc: "List the services and their state"
    cmds:
      - docker compose ps

  logs:
    desc: "Follow the logs from the last 200 lines"
    cmds:
      - docker compose logs -f --tail=200
