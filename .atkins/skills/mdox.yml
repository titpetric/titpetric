name: Markdown formatting and linting
help: >-
  Formats docs/ and README.md with mdox, checks that docs/ is formatted, and
  runs vale over the tree when .vale.ini is present. mdox:fmt rewrites the
  files in place; mdox:lint only reports.

when:
  files:
    - .vale.ini
    - docs/
    - README.md

tasks:
  default:
    desc: "Check the markdown formatting and language"
    cmds:
      - task: lint

  fmt:
    desc: "Rewrite docs/ and README.md in mdox format"
    cmds:
      - if: $(test -d docs)
        cmd: mdox fmt ${{ files }} || true
        vars:
          files: $(find ./docs -name '*.md' 2>/dev/null | xargs --no-run-if-empty echo || true)
      - if: $(test -f README.md)
        cmd: mdox fmt README.md

  lint:
    desc: "Check docs/ formatting and run vale over the tree"
    vars:
      files: $(find ./docs -name '*.md' 2>/dev/null | xargs --no-run-if-empty echo || true)
    cmds:
      - if: $(test -d docs)
        cmd: mdox fmt --check ${{ files }}
      # vale reads .vale.ini and .vale/styles from the working directory, so it
      # runs at the repository root and walks the whole tree rather than a list
      # of documents. The sections in .vale.ini pick the files, markdown and
      # code alike: a doc comment is prose, and the pages under docs/ are
      # generated from the comments a docs-only scan would never read.
      - if: $(test -f .vale.ini)
        cmd: docker run --rm -v $PWD:/src -w /src jdkato/vale --output=line .

  setup:
    desc: "Install mdox from the main branch"
    interactive: true
    cmds:
      - go install github.com/bwplotka/mdox@main
