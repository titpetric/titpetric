name: Markdown formatting and linting
help: >-
  Formats and checks the markdown under docs/ and README.md with mdox, and
  runs vale over both when .vale.ini is present. mdox:fmt rewrites the files
  in place; mdox:lint only reports.

when:
  files:
    - .vale.ini
    - docs/
    - README.md

tasks:
  default:
    desc: "Run mdox to check markdowns"
    cmds:
      - task: lint

  fmt:
    desc: "Run mdox to format markdowns"
    passthru: true
    cmds:
      - if: $(test -d docs)
        cmd: mdox fmt ${{ files }} || true
        vars:
          files: $(find ./docs -name '*.md' 2>/dev/null | xargs --no-run-if-empty echo || true)
      - if: $(test -f README.md)
        cmd: mdox fmt README.md

  lint:
    desc: "Run vale to lint language"
    passthru: true
    vars:
      files: $(find ./docs -name '*.md' 2>/dev/null | xargs --no-run-if-empty echo || true)
      # vale reads .vale.ini from the working directory, and the file sits at
      # the repository root, not under docs/. Mount the whole tree so the
      # config is in reach and both README.md and docs/ can be scanned.
      targets: $(ls -d README.md docs 2>/dev/null | xargs --no-run-if-empty echo || true)
    cmds:
      - if: $(test -d docs)
        cmd: mdox fmt --check ${{ files }}
      - if: $(test -f .vale.ini && test -n "$(ls -d README.md docs 2>/dev/null)")
        cmd: docker run --rm -v $PWD:/src -w /src jdkato/vale ${{ targets }}

  setup:
    desc: "Install bwplotka/mdox"
    interactive: true
    cmds:
      - go install github.com/bwplotka/mdox@main
